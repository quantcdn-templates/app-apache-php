; Restores the official php image's defaults where Debian's PHP build differs.
;
; Debian compiles in session.save_path=/var/lib/php/sessions, a directory that
; PHP's own session garbage collection cannot list (mode 1733); Debian relies on
; a cron job to clean it, and containers run no cron. An empty value makes PHP
; use the system temp directory, as the official image does. Later files in
; conf.d, or a php.ini, still override this.
session.save_path = ""
