# Legacy/EOL PHP multipart hardening — CVE-2026-109618 / CVE-2026-109619
# (PHP session.upload_progress / multipart-parser heap use-after-free RCE).
#
# PHP 7.4 is end-of-life and will NOT receive the upstream fix on a reliable
# schedule, so this image blocks the vulnerable vector — multipart/form-data
# POST requests — at Apache, BEFORE PHP reads the body. It is DEFAULT-ON
# (blocking) because an unpatched RCE is the greater risk than losing uploads.
#
# OPT BACK IN (customers who require file uploads and accept the risk):
#   set the container environment variable  QUANT_ALLOW_MULTIPART=true
#
# Behaviour:
#   - default / unset / any value != "true"  -> multipart POST denied (403)
#   - QUANT_ALLOW_MULTIPART=true              -> multipart POST allowed
#   - GET, JSON and urlencoded POST are never affected.
#
# Remove this file + its COPY/a2enconf from Dockerfile.php74 if/when PHP 7.4 is
# retired or a trusted backported fix is shipped in this image.
<If "%{REQUEST_METHOD} == 'POST' && %{HTTP:Content-Type} =~ m#^multipart/form-data#i && osenv('QUANT_ALLOW_MULTIPART') != 'true'">
    Require all denied
</If>
