# Replaces Debian's mod_php configuration. Debian's version also runs .phtml
# and .phar files as PHP; the official php images run only .php, which is set
# in conf-available/docker-php.conf. Keeping to .php narrows what an uploaded
# file can execute.
<FilesMatch "^\.ph(ar|p|ps|tml)$">
	Require all denied
</FilesMatch>
