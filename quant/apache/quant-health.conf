# Cheap liveness endpoint for load balancer health checks.
# Point the platform at it with the container label  quant.healthcheck.path: /_quant/health
# Apache serves a static file from the image: no PHP, no document root, no shared volume (EFS) reads.
# It proves Apache is up; it does not prove the application works.
Alias /_quant/health /usr/local/share/quant/health.txt
<Directory /usr/local/share/quant>
    AllowOverride None
    Require all granted
</Directory>
<Location /_quant/health>
    Header set Cache-Control "no-store"
</Location>
